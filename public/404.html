<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>21foredit - جاري التحميل...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var hostname = window.location.hostname;
        var repoPrefix = '';

        if (hostname.endsWith('github.io')) {
          var parts = path.split('/').filter(Boolean);
          if (parts.length > 0) {
            repoPrefix = '/' + parts[0];
          }
        }

        // Redirect safely back to the app entry point
        window.location.replace(
          (repoPrefix || '') + '/' + window.location.search + window.location.hash
        );
      })();
    </script>
  </head>
  <body style="background-color: #050505; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 14px; color: #a1a1aa;">جاري التحميل إلى 21foredit...</p>
    </div>
  </body>
</html>
